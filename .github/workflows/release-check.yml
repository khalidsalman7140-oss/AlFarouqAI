name: manual-release-check-no-publish
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m 'not optional and not model and not system'
      - run: python -m build
      - run: python -m twine check dist/*
# Intentionally no PyPI, GitHub release, Hugging Face or Kaggle publishing step.
