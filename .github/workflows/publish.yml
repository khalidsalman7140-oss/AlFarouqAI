name: owner-approved-pypi-release
on:
  workflow_dispatch:
    inputs:
      destination:
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      publish:
        type: boolean
        default: false
        description: 'Explicit approval to upload built package'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/prepublish_check.py
      - run: python -m pytest -m 'not optional and not model and not system'
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.destination == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
